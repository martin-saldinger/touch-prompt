name: Screenshots

on: pull_request

jobs:
  screenshots:
    runs-on: macos-14
    strategy:
      matrix:
        mode: [touch, missed, reconnect]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The prompt shows the last commit subject; use the PR's, not the merge commit's.
          ref: ${{ github.event.pull_request.head.sha }}
      - run: swiftc -O touch-prompt.swift -o touch-prompt
      - run: ./git-ssh-sign --preview ${{ matrix.mode }} ${{ matrix.mode }}.png
      # Unzipped artifacts hold one file each and open in the browser.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.mode }}.png
          archive: false
