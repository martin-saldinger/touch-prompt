name: Screenshots

on: pull_request

# Two runs on one branch would race to push; keep only the latest.
concurrency:
  group: screenshots-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - run: swiftc -O touch-prompt.swift -o touch-prompt
      - run: command -v ffmpeg || brew install ffmpeg
      - name: Render docs/screenshots.md
        run: |
          # The prompt shows the last commit subject. Render from a scratch repo
          # so it's fixed and the images only change when the prompt does.
          sample=$(mktemp -d)
          git -C "$sample" init -q
          git -C "$sample" -c user.name=sample -c user.email=sample@example.com commit -q --allow-empty -m "Add a preview mode to git-ssh-sign"
          rm -rf docs/screenshots
          mkdir docs/screenshots
          page=docs/screenshots.md
          shot() {
            git -C "$sample" config touch-prompt.style "$1"
            (cd "$sample" && "$GITHUB_WORKSPACE/git-ssh-sign" --preview "$2" "$GITHUB_WORKSPACE/docs/screenshots/$3.png")
          }
          printf '# Screenshots\n\n`.github/workflows/screenshots.yml` regenerates this page with `git-ssh-sign --preview` on every pull request.\n\n## Prompts\n' > "$page"
          for mode in touch missed reconnect; do
            shot card "$mode" "$mode"
            printf '\n### `--preview %s`\n\n![The %s prompt](screenshots/%s.png)\n' "$mode" "$mode" "$mode" >> "$page"
          done
          printf '\n## Styles\n\nEach shows `--preview touch` with `touch-prompt.style` set.\n' >> "$page"
          for style in fullscreen card hud; do
            shot "$style" touch "style-$style"
            printf '\n### `%s`\n\n![The %s style](screenshots/style-%s.png)\n' "$style" "$style" "$style" >> "$page"
          done
          printf '\n### `none`\n\nPlays only the sound.\n' >> "$page"
      - name: Commit changed screenshots
        # Fork PRs get a read-only token, so they render but can't push.
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add docs/screenshots.md docs/screenshots
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update screenshots"
          git push -q
